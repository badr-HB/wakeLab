<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link href="./output.css" rel="stylesheet"> -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./input.css">
</head>
</head>

<body class="w-full h-full bg-[#eef3f9] scroll-smooth">
    <div class="w-full h-full absolute" id="popParent">
        <div class="w-full h-full flex items-center justify-center">
            <div class="xl:w-1/4 w-1/2 h-auto py-10 bg-white border rounded-3xl flex flex-col justify-center fixed">
                <div class="relative">
                    <span class="absolute -top-8 right-3 cursor-pointer" id="cross">❌</span>
                </div>
                <form action="" class="space-y-6 px-4" id="usernameForm">
                    <div class="flex flex-col space-y-3">
                        <label class="font-medium" for="name">enter your name :</label>
                        <input class="border py-1 pl-3 rounded-xl " placeholder="insert username" type="text"
                            name="usernameInput" id="usernameInput" />
                    </div>
                    <p class="absolute top-27 font-light text-[14px] text-red-600 hidden danger"></p>
                    <input class="flex place-self-center bg-black text-white px-8 py-2 rounded-xl cursor-pointer"
                        value="register" type="submit" name="registeruser" id="registeruser" />
                </form>
            </div>
        </div>
    </div>
    <main class="w-full h-full">
        <div
            class="bg-blue-300 md:h-25 h-35 flex flex-col md:flex-row min-w-112.5 lg:justify-between justify-center items-center gap-4 mb-10 px-10">
            <div>
                <input value="edit name"
                    class="cursor-pointer h-10 w-52 bg-green-500 rounded-[15px] text-white"
                    type="button" id="editName"/>
            </div>
            <div class="flex gap-5">
                <input placeholder="search..." class="bg-white w-85 h-10 rounded-[15px] px-3" type="search"
                    id="search" />
                <input value="search" type="button"
                    class="cursor-pointer bg-blue-500 h-10 w-25 rounded-[15px] text-white" />
            </div>
            <a href="#form" class="">
                <input value="create event"
                    class="cursor-pointer h-10 w-52 bg-green-500 rounded-[15px] text-white"
                    type="button" /></a>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-9 px-5" id="CardContainer">
        </div>
        <form action="/src/index.html" id="form"
            class="my-15 border w-2/4 min-w-[320px] py-15 h-auto flex flex-col items-center gap-10 rounded-2xl mx-10">
            <div class="flex flex-col md:flex-row items-center space-y-5 md:space-y-0 w-full justify-evenly">
                <div class="flex flex-col">
                    <label for="title" class="text-[18px]">activity title :</label>
                    <input type="text" name="title" placeholder="title"
                        class="text-[16px] border py-3 w-full rounded-xl pl-3" id="title" />
                    <p class="text-[14px] text-red-500"></p>
                </div>
                <div class="flex flex-col">
                    <label for="description" class="text-[18px]">description of the activity</label>
                    <input type="text" name="description" placeholder="description"
                        class="text-[16px] border py-3 w-full rounded-xl pl-3" id="description">
                    <p class="text-[14px] text-red-500"></p>
                </div>
            </div>
            <div class="flex flex-col md:flex-row items-center space-y-5 md:space-y-0 w-full justify-evenly">
                <div class="flex flex-col ">
                    <label for="objectifs">objectf of this activity</label>
                    <input type="text" name="objectifs" placeholder="objectifs"
                        class="text-[16px] border py-3 w-full rounded-xl pl-3" id="objectifs" />
                    <p class="text-[14px] text-red-500"></p>
                </div>
                <div class="flex flex-col">
                    <label for="duration">how much time?</label>
                    <input type="number" name="duration" placeholder="enter duration number"
                        class="text-[16px] border py-3 w-full rounded-xl pl-3" id="duration" />
                    <p class="text-[14px] text-red-500"></p>
                </div>
            </div>
            <div>
                <label for="theme"></label>
                <select name="theme">
                    <option value="">choose theme</option>
                    <option value="jeu">jeu</option>
                    <option value="apprentissage">apprentissage</option>
                    <option value="exercice">exercice</option>
                    <option value="others">others</option>
                </select>
                <p class="text-[14px] text-red-500"></p>
            </div>
            <input value="create activity" class="cursor-pointer h-10 w-52 bg-green-500 rounded-[15px] text-white"
                type="submit" id="submitForm" />
        </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./script.js" type="module"></script>
</body>

</html>
